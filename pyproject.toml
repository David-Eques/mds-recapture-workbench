[project]
name = "mds-recapture-workbench"
version = "0.1.0"
description = "A narrow, deterministic MDS/PDPM evidence-review workbench using real OCR and the CMS grouper."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.111",
    "pillow>=10.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "import-linter>=2.0",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "reportlab>=4.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["grouper-jar"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
exclude = ["grouper-jar/"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/public"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Rules do not calculate dollars"
type = "forbidden"
source_modules = ["app.rules"]
forbidden_modules = ["app.pricing"]

[[tool.importlinter.contracts]]
name = "Grouper does not detect clinical evidence"
type = "forbidden"
source_modules = ["app.grouper"]
forbidden_modules = ["app.rules"]
