name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.19"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v7.0.0
        with: { node-version: "22", cache: npm }
      - uses: astral-sh/setup-uv@v10.1.0
        with: { version: "${{ env.UV_VERSION }}" }
      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/bootstrap_cms_grouper.py
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run lint-imports
      - run: uv run python scripts/check_public_tree.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with: { version: "0.11.19" }
      - run: uv sync --frozen --extra dev
      - run: docker build --no-cache -t mds-recapture-workbench .
      - run: make container-smoke
